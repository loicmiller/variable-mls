[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmls"
version = "2.0.0"
description = "NIPoPoWs with variable mining difficulty, measured on the Bitcoin header chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "pandas", "matplotlib", "scipy", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["vmls"]

[tool.pytest.ini_options]
testpaths = ["tests"]

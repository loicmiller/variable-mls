[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmls"
version = "2.0.0.dev0"
description = "NIPoPoWs with variable mining difficulty, measured on the Bitcoin header chain"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Loïc Miller" }]
keywords = ["NIPoPoW", "proof of work", "light client", "Bitcoin", "variable difficulty", "blockchain"]
# Lower bounds: the versions the regressions were checked with (2026-11-23).
dependencies = ["numpy>=2.5", "pandas>=3.1", "matplotlib>=3.11", "scipy>=1.18", "requests>=2.34"]

[project.optional-dependencies]
dev = ["pytest>=9.2"]

[project.scripts]
vmls = "vmls.cli:main"

[tool.setuptools]
packages = ["vmls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
